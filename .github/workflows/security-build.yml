name: 보안 및 빌드 검증

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Git 이력 비밀정보 검사
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 .

      - name: Java 설정
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 비밀정보 검사
        shell: pwsh
        run: |
          ./scripts/test-check-secrets.ps1
          ./scripts/check-secrets.ps1

      - name: 테스트와 빌드
        run: ./gradlew --no-daemon clean test bootJar
