spring.application.name=aspera-web
server.port=${SERVER_PORT:8080}

# Render friendly error pages without exposing exception details.
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# This application never receives file uploads. Keep request parsing bounded.
spring.servlet.multipart.enabled=false
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
server.tomcat.max-parameter-count=500
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=20s
server.tomcat.threads.max=${SERVER_THREADS_MAX:100}
server.tomcat.threads.max-queue-capacity=${SERVER_REQUEST_QUEUE_CAPACITY:200}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:100}

# Secrets must be injected at runtime. Never place real values in this file.
aspera.node.url=${ASPERA_NODE_URL:}
aspera.node.username=${ASPERA_NODE_USERNAME:}
aspera.node.password=${ASPERA_NODE_PASSWORD:}
aspera.node.allowed-origins=${ASPERA_NODE_ALLOWED_ORIGINS:}

# Database configuration. Credentials intentionally have no repository default.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

# Schema management can be overridden per environment. SQL values are not logged.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# The first administrator is created only when explicitly enabled.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}

# Session defaults are tightened further by the production profile.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
