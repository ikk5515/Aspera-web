<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign In - Aspera Web</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block th:replace="~{fragments/theme :: themeLogic}"></th:block>
</head>

<body class="auth-page">
    <a class="skip-link" href="#login-form">Skip to sign-in form</a>

    <div class="theme-corner">
        <th:block th:replace="~{fragments/theme :: toggleButton}"></th:block>
    </div>

    <main class="login-container" aria-labelledby="login-title">
        <section class="card login-card">
            <div class="card-body">
                <header class="login-brand">
                    <svg class="brand-mark" width="48" height="48" viewBox="0 0 32 32" fill="currentColor"
                        aria-hidden="true" focusable="false">
                        <path
                            d="M16,2A14,14,0,1,0,30,16,14.0158,14.0158,0,0,0,16,2Zm0,26A12,12,0,1,1,28,16,12.0137,12.0137,0,0,1,16,28Z">
                        </path>
                        <path
                            d="M15 11L15 21 17 21 17 11 15 11zM11 11L11 21 13 21 13 11 11 11zM19 11L19 21 21 21 21 11 19 11z">
                        </path>
                    </svg>
                    <h1 id="login-title" class="login-title">Aspera Web</h1>
                    <p class="login-subtitle">Sign in to access your files</p>
                </header>

                <div th:if="${param.error}" class="alert alert-error" role="alert" aria-live="assertive">
                    <span>Invalid username or password. Check your details and try again.</span>
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="status" aria-live="polite">
                    <span>You have signed out successfully.</span>
                </div>
                <div th:if="${param.expired}" class="alert alert-error" role="alert" aria-live="assertive">
                    <span>Your session has ended. Sign in again to continue.</span>
                </div>

                <form id="login-form" th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                            placeholder="Enter your username" autocomplete="username" autocapitalize="none"
                            spellcheck="false" maxlength="100" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Enter your password" autocomplete="current-password" maxlength="200" required>
                    </div>
                    <button type="submit" class="btn btn-primary login-btn">Sign In</button>
                </form>

                <footer class="login-footer">Secure file access portal</footer>
            </div>
        </section>
    </main>
</body>

</html>
