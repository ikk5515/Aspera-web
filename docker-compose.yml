services:
  aspera-web:
    build: .
    image: aspera-web:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
